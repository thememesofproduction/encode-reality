<title id="labfig-monetary-gov-deficit-title">Monetary circuit + government: private_money, gov_balance</title>
<desc id="labfig-monetary-gov-deficit-desc">A government that spends more than it collects in tax, in a stock-flow consistent monetary circuit with no new bank lending: its balance falls below zero by exactly as much as the private sector's deposits rise. Line chart of private_money, gov_balance against t from 0 to 10: private_money from 100 to 124.55; gov_balance from -24.553 to 0. Computed as monetary_gov · ODE · RK4 · 2,000 steps · seed —.</desc>
