<title id="labfig-goodwin-cycle-title">Goodwin growth cycle: wage_share, employment</title>
<desc id="labfig-goodwin-cycle-desc">Goodwin's growth cycle at the model's default parameters: the wage share and the employment rate rise and fall in a closed cycle, the wage share peaking after employment does. Line chart of wage_share, employment against t from 0 to 200: wage_share from 0.87137 to 0.94976; employment from 0.86855 to 0.9322. Computed as goodwin · ODE · RK4 · 20,000 steps · seed —.</desc>
